<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Español – Zona de Juegos</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--ink:#172033;--muted:#667085;--accent:#e85d04;--accent2:#ffba08;--ok:#2a9d8f;--bad:#d62828}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#fff7ed,#fff1d6);color:var(--ink)}
header{padding:28px 18px;text-align:center;background:#fff;border-bottom:1px solid #eee}
h1{margin:0;font-size:clamp(28px,5vw,46px)} .sub{color:var(--muted);margin-top:6px}
.wrap{max-width:1050px;margin:auto;padding:22px}.levels,.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
button{border:0;border-radius:14px;padding:13px 15px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;box-shadow:0 4px 14px #0001}
button:hover{transform:translateY(-1px)}button.active,.primary{background:var(--accent);color:#fff}.game{padding:18px;text-align:left;min-height:100px}
.game b{display:block;font-size:18px;margin-bottom:5px}.panel{margin-top:18px;background:var(--card);border-radius:20px;padding:22px;box-shadow:0 8px 30px #00000012}
.hidden{display:none}.topline{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.score{font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr));gap:12px;margin-top:18px}
.tile,.word,.choice{border:2px solid #eee;background:#fff;border-radius:16px;padding:15px;text-align:center;cursor:pointer;min-height:72px}
.tile{font-size:38px}.tile small{display:block;font-size:13px;color:var(--muted)}.selected{border-color:var(--accent);background:#fff4e6}.matched{border-color:var(--ok);background:#e9fbf7;opacity:.7}
.choice{font-size:17px}.choice.correct{border-color:var(--ok);background:#e9fbf7}.choice.wrong{border-color:var(--bad);background:#fff0f0}
.big{font-size:clamp(22px,4vw,34px);font-weight:800;text-align:center;margin:22px 0}.sentence{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0}.chip{padding:12px 16px;border-radius:12px;background:#f5f5f5;cursor:pointer;font-weight:700}
.answer{min-height:55px;border:2px dashed #ccc;border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px}.feedback{text-align:center;font-weight:800;min-height:28px;margin:15px 0}
.progress{height:10px;background:#eee;border-radius:10px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}.tile,.word,.choice,.chip{overflow-wrap:anywhere}.chip:disabled{cursor:default}.puzzle-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}
input{width:100%;padding:13px;border:2px solid #ddd;border-radius:12px;font-size:17px}.footer{text-align:center;color:var(--muted);padding:20px}

.story-text{font-size:18px;line-height:1.75;max-width:750px;margin:18px auto}.story-text p{margin:0 0 14px}.activity-controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.media-status{color:var(--muted);font-size:14px;min-height:22px}.story-options{display:grid;gap:12px}.story-options .choice{text-align:left;line-height:1.5;width:100%}.question-number{color:var(--muted);font-weight:700}.story-heading{font-size:25px;margin:20px 0 12px}.cinema-stage{overflow:hidden;position:relative;border-radius:18px;min-height:180px;background:linear-gradient(#c8e9ff 65%,#d5ebbc 65%);display:flex;justify-content:center;align-items:flex-end;gap:24px;padding:25px}.scene-place{position:absolute;font-size:75px;left:50%;top:10px;transform:translateX(-50%);opacity:.65}.actor{font-size:65px;z-index:1;animation:actor-enter .6s ease-out both}.actor:nth-child(3){animation-delay:.12s}.actor.speaking{animation:actor-talk 1.4s ease-in-out infinite}.scene-caption{font-size:18px;line-height:1.7;border:2px solid #ffba08;border-radius:16px;background:#fffdf3;padding:18px;margin-top:14px}.reading-tip{background:#fff4e6;border-radius:12px;padding:12px;line-height:1.6}button:disabled{opacity:.55;transform:none;cursor:default}@keyframes actor-enter{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes actor-talk{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-7px)}}@media(prefers-reduced-motion:reduce){.actor,.actor.speaking{animation:none}}@media(max-width:400px){.wrap{padding:14px}.panel{padding:15px}.actor{font-size:52px}.story-text,.scene-caption{font-size:17px}}
.film-frame{display:block;border:0;border-radius:18px;width:100%;height:820px;background:#173638}@media(max-width:600px){.film-frame{height:690px}}
</style>
</head>
<body>
<header><h1>🇪🇸 Español – Zona de Juegos</h1><div class="sub">Aprender jugando · Wortschatz, Grammatik und Sprachgefühl</div></header>
<div class="wrap">
<h2>1. Schwierigkeitsgrad</h2>
<div class="levels">
<button class="lvl active" data-l="1">🌱 Stufe 1<br><small>Grundlagen</small></button>
<button class="lvl" data-l="2">🚀 Stufe 2<br><small>Aufbau</small></button>
<button class="lvl" data-l="3">🧠 Stufe 3<br><small>Fortgeschritten</small></button>
<button class="lvl" data-l="4">🏆 Stufe 4<br><small>Challenge</small></button>
</div>
<h2>2. Wähle ein Spiel</h2>
<div class="games">
<button class="game" onclick="start('match')"><b>🖼️ Bild & Wort</b>Finde die passenden Paare.</button>
<button class="game" onclick="start('odd')"><b>🕵️ Eindringling</b>Welches Wort passt nicht?</button>
<button class="game" onclick="start('puzzle')"><b>🧩 Satz-Puzzle</b>Baue den Satz richtig zusammen.</button>
<button class="game" onclick="start('detective')"><b>🔎 Fehlerdetektiv</b>Finde die richtige Form.</button>
<button class="game" onclick="start('guess')"><b>❓ ¿Quién soy?</b>Errate das Wort aus Hinweisen.</button>
<button class="game" onclick="start('reading')"><b>📖 Historias</b>Lies eine Geschichte und löse drei Fragen.</button>
<button class="game" onclick="start('summary')"><b>📝 Resumen</b>Welche Zusammenfassung stimmt?</button>
<button class="game" onclick="start('listening')"><b>🎧 Escucha</b>Höre eine Geschichte und beantworte Fragen.</button>
<button class="game" onclick="start('cinema')"><b>🎬 Mini-Geschichte</b>Verschiedene Trickfilme mit Dialogen und Fragen.</button>
<button class="game" onclick="start('mission')"><b>💬 Tu misión</b>Was sagst du in dieser Situation?</button>
<button class="game" onclick="surprise()"><b>🎲 Überrasch mich!</b>Ein zufälliges Spiel wartet auf dich.</button>
</div>
<div id="panel" class="panel hidden">
<div class="topline"><button onclick="home()">← Spiele</button><div class="score">⭐ Punkte: <span id="score">0</span></div></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="content"></div><div id="fb" class="feedback" role="status" aria-live="polite"></div>
</div>
</div><div class="footer">¡Vamos! Fehler gehören zum Lernen. 💪</div>
<script>
let level=1,score=0,round=0,game='',selected=null,answer=[];
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lvl').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=+b.dataset.l;if(game)start(game)});
const vocab=[[{"e": "🏠", "w": "la casa"}, {"e": "🚗", "w": "el coche"}, {"e": "⚽", "w": "el balón"}, {"e": "👨", "w": "el hombre"}, {"e": "🐶", "w": "el perro"}, {"e": "🍎", "w": "la manzana"}, {"e": "🐱", "w": "el gato"}, {"e": "🐴", "w": "el caballo"}, {"e": "🐟", "w": "el pez"}, {"e": "🐦", "w": "el pájaro"}, {"e": "🌳", "w": "el árbol"}, {"e": "🌸", "w": "la flor"}, {"e": "☀️", "w": "el sol"}, {"e": "🌙", "w": "la luna"}, {"e": "⭐", "w": "la estrella"}, {"e": "🍌", "w": "el plátano"}, {"e": "🍐", "w": "la pera"}, {"e": "🍞", "w": "el pan"}, {"e": "🧀", "w": "el queso"}, {"e": "🥛", "w": "la leche"}, {"e": "👟", "w": "el zapato"}, {"e": "👕", "w": "la camiseta"}, {"e": "📖", "w": "el libro"}, {"e": "✏️", "w": "el lápiz"}], [{"e": "✈️", "w": "el avión"}, {"e": "🏫", "w": "la escuela"}, {"e": "🍽️", "w": "el plato"}, {"e": "🌧️", "w": "la lluvia"}, {"e": "📚", "w": "los libros"}, {"e": "🚲", "w": "la bicicleta"}, {"e": "🚂", "w": "el tren"}, {"e": "🚢", "w": "el barco"}, {"e": "🚌", "w": "el autobús"}, {"e": "🏥", "w": "el hospital"}, {"e": "🏖️", "w": "la playa"}, {"e": "⛰️", "w": "la montaña"}, {"e": "🌉", "w": "el puente"}, {"e": "🧳", "w": "la maleta"}, {"e": "☂️", "w": "el paraguas"}, {"e": "🔑", "w": "la llave"}, {"e": "⌚", "w": "el reloj"}, {"e": "📱", "w": "el móvil"}, {"e": "💻", "w": "el ordenador"}, {"e": "🪑", "w": "la silla"}, {"e": "🛏️", "w": "la cama"}, {"e": "🪟", "w": "la ventana"}, {"e": "🚪", "w": "la puerta"}, {"e": "🧊", "w": "el hielo"}], [{"e": "🚲➡️🏫", "w": "ir al colegio en bicicleta"}, {"e": "📖👀", "w": "leer un libro"}, {"e": "🎧🎵", "w": "escuchar música"}, {"e": "🍳🥘", "w": "preparar la comida"}, {"e": "🛒🍎", "w": "comprar fruta"}, {"e": "🧹🏠", "w": "limpiar la casa"}, {"e": "🐕🚶", "w": "pasear al perro"}, {"e": "🏊💧", "w": "nadar en la piscina"}, {"e": "⚽🥅", "w": "jugar al fútbol"}, {"e": "✍️✉️", "w": "escribir una carta"}, {"e": "📞👵", "w": "llamar a la abuela"}, {"e": "🪥🦷", "w": "cepillarse los dientes"}, {"e": "🧼👐", "w": "lavarse las manos"}, {"e": "🌱💧", "w": "regar una planta"}, {"e": "📸🌄", "w": "hacer una foto"}, {"e": "🎸🎵", "w": "tocar la guitarra"}, {"e": "💃🎵", "w": "bailar"}, {"e": "🛏️😴", "w": "dormir"}, {"e": "🏃🌳", "w": "correr por el parque"}, {"e": "🚗🛣️", "w": "conducir un coche"}, {"e": "🚂🧳", "w": "viajar en tren"}, {"e": "🥾⛰️", "w": "caminar por la montaña"}, {"e": "🍽️🧽", "w": "lavar los platos"}, {"e": "🎂🎉", "w": "celebrar un cumpleaños"}], [{"e": "🚫📱🚗", "w": "no usar el móvil al conducir"}, {"e": "♻️🗑️", "w": "separar los residuos"}, {"e": "🚰🚫", "w": "cerrar el grifo"}, {"e": "💡🚫", "w": "apagar la luz"}, {"e": "🌳🌱", "w": "plantar un árbol"}, {"e": "🩹🦵", "w": "curar una herida"}, {"e": "🩼🚶", "w": "caminar con muletas"}, {"e": "🧑‍🚒🔥", "w": "apagar un incendio"}, {"e": "🧑‍⚕️🩺", "w": "examinar a un paciente"}, {"e": "🧑‍🏫📝", "w": "corregir un examen"}, {"e": "🧑‍🍳🔪🥕", "w": "cortar las verduras"}, {"e": "🧵🪡👕", "w": "coser una camiseta"}, {"e": "🔨🪑", "w": "reparar una silla"}, {"e": "🎁📦", "w": "envolver un regalo"}, {"e": "⚖️🍎", "w": "pesar la fruta"}, {"e": "🌡️🤒", "w": "medir la temperatura"}, {"e": "🔭🌙", "w": "observar la luna"}, {"e": "🔬🧪", "w": "hacer un experimento"}, {"e": "🤝📝", "w": "firmar un acuerdo"}, {"e": "💳🛒", "w": "pagar con tarjeta"}, {"e": "🛂🧳", "w": "mostrar el pasaporte"}, {"e": "🗺️🧭", "w": "orientarse con un mapa"}, {"e": "🧗⛰️", "w": "escalar una montaña"}, {"e": "🤿🐠", "w": "bucear en el mar"}]];
const pictureDecks=[[],[],[],[]];
const previousPictures=[[],[],[],[]];
function shuffled(values){const result=[...values];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function nextPictures(){const index=level-1;if(pictureDecks[index].length<6){const previous=new Set(previousPictures[index]);const fresh=shuffled(vocab[index].filter(x=>!previous.has(x.w)));const recent=shuffled(vocab[index].filter(x=>previous.has(x.w)));pictureDecks[index]=fresh.concat(recent)}const items=pictureDecks[index].splice(0,6);previousPictures[index]=items.map(x=>x.w);return shuffled(items)}
const odds=[
[['perro','gato','caballo','mesa'],['lunes','martes','jueves','zapato']],
[['comer','beber','dormir','azul'],['enero','abril','junio','domingo']],
[['hablé','comí','salí','vivía'],['siempre','nunca','ayer','mesa']],
[['aunque','sin embargo','por eso','tenedor'],['hubiera','tuviera','fuera','comemos']]
];
const puzzles=[
['Yo vivo en Madrid.','Yo vivo en Madrid .'],['Mi hermana tiene un perro.','Mi hermana tiene un perro .'],
['Ayer fuimos al cine.','Ayer fuimos al cine .'],['¿Qué vas a hacer mañana?','¿Qué vas a hacer mañana ?'],
['Cuando era pequeño, jugaba al fútbol.','Cuando era pequeño , jugaba al fútbol .'],['No lo compré porque era demasiado caro.','No lo compré porque era demasiado caro .'],
['Si tuviera más tiempo, aprendería italiano.','Si tuviera más tiempo , aprendería italiano .'],['Aunque hubiera llovido, habríamos salido.','Aunque hubiera llovido , habríamos salido .']
];
const detective=[
[['Yo tengo quince años.','Yo soy quince años.'],['Ayer fui al parque.','Ayer fui al parques.']],
[['He comido mucho hoy.','He comí mucho hoy.'],['Nos gusta la música.','Nos gustan la música.']],
[['Cuando era niño, vivía en Sevilla.','Cuando era niño, yo vivíamos en Sevilla.'],['Se lo di ayer.','Le lo di ayer.']],
[['Si lo hubiera sabido, no habría venido.','Si lo habría sabido, no hubiera venido.'],['Busco a alguien que sepa francés.','Busco a alguien que sepas francés.']]
];
const guesses=[
[{h:'Soy tu vivienda. Tengo habitaciones y una puerta. Mi nombre tiene cuatro letras y empieza por c.',a:'casa'},{h:'Tengo cuatro ruedas. Me conduces por la carretera y transporto personas.',a:'coche',accept:['carro','auto','automóvil']}],
[{h:'Soy una persona. Enseño a los alumnos.',a:'profesor',accept:['profesora','maestro','maestra','docente']},{h:'Me abres sobre tu cabeza cuando llueve. Mi nombre empieza por p.',a:'paraguas'}],
[{h:'No soy ayer ni mañana. Soy...',a:'hoy'},{h:'En un partido, soy lo contrario de perder.',a:'ganar',accept:['vencer']}],
[{h:'Significo comprender de repente una situación. Soy una expresión de tres palabras que empieza por darse.',a:'darse cuenta'},{h:'Significo alcanzar algo difícil que querías.',a:'lograr',accept:['conseguir','alcanzar']}]
];
let advancing=false, pendingTimer=null, puzzleWords=[], currentPuzzle=null, currentGuess=null;
function cancelAdvance(){stopMedia();if(pendingTimer!==null)clearTimeout(pendingTimer);pendingTimer=null;advancing=false}
function scheduleNext(delay){pendingTimer=setTimeout(()=>{pendingTimer=null;round++;next()},delay)}
function start(g){cancelAdvance();game=g;score=0;round=0;document.getElementById('panel').classList.remove('hidden');document.querySelector('.games').style.display='none';document.getElementById('score').textContent=score;next()}
function surprise(){start(shuffled(['match','odd','puzzle','detective','guess','reading','summary','listening','cinema','mission'])[0])}
function home(){cancelAdvance();game='';selected=null;document.getElementById('panel').classList.add('hidden');document.querySelector('.games').style.display='grid'}
function fb(t,ok){let f=document.getElementById('fb');f.textContent=t;f.style.color=ok?'var(--ok)':'var(--bad)'}
function clearChoices(){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('wrong','correct'))}
function win(){if(advancing)return;advancing=true;score+=10;document.getElementById('score').textContent=score;fb('¡Muy bien! +10 ⭐',true);scheduleNext(1000)}
function next(){cancelAdvance();document.getElementById('bar').style.width=((round%5)/5*100)+'%';fb('',true);const games={match,odd,puzzle,detective:detect,guess,reading:()=>storyActivity('reading'),summary:()=>storyActivity('summary'),listening:()=>storyActivity('listening'),cinema:()=>storyActivity('cinema'),mission};if(games[game])games[game]()}
function button(text,cls,action){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=text;b.onclick=()=>action(b);return b}
function match(){let items=nextPictures();document.getElementById('content').innerHTML='<div class="big">Verbinde Bild und spanisches Wort</div><div id="pictures" class="grid"></div><div id="words" class="grid"></div>';items.forEach(x=>{const b=button(x.e,'tile',pickImg);b.dataset.w=x.w;b.setAttribute('aria-label','Bild '+(document.getElementById('pictures').children.length+1));document.getElementById('pictures').appendChild(b)});shuffled(items).forEach(x=>{const b=button(x.w,'word',pickWord);b.dataset.w=x.w;document.getElementById('words').appendChild(b)});selected=null}
function pickImg(e){if(advancing||e.classList.contains('matched'))return;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');selected=e;fb('Wähle das passende spanische Wort.',true)}
function pickWord(e){if(advancing||e.classList.contains('matched'))return;if(!selected)return fb('Wähle zuerst ein Bild.',false);if(e.dataset.w===selected.dataset.w){e.classList.add('matched');selected.classList.remove('selected');selected.classList.add('matched');e.disabled=true;selected.disabled=true;score+=3;document.getElementById('score').textContent=score;fb('¡Correcto!',true);selected=null;if(document.querySelectorAll('.word:not(.matched)').length===0){advancing=true;scheduleNext(1000)}}else fb('Noch nicht – wähle ein anderes Wort oder Bild.',false)}
function odd(){let q=odds[level-1][round%odds[level-1].length],correct=q[q.length-1];document.getElementById('content').innerHTML='<div class="big">🕵️ Welches Wort passt nicht?</div><div class="grid" id="choices"></div>';shuffled(q).forEach(x=>document.getElementById('choices').appendChild(button(x,'choice',el=>chooseOdd(el,x,correct))))}
function chooseOdd(el,x,a){if(advancing)return;clearChoices();if(x===a){el.classList.add('correct');win()}else{el.classList.add('wrong');fb('Das gehört zur Gruppe. Versuch es noch einmal.',false)}}
function puzzle(){currentPuzzle=puzzles[(level-1)*2+round%2];puzzleWords=shuffled(currentPuzzle[1].split(' '));answer=[];document.getElementById('content').innerHTML='<div class="big">🧩 Baue den spanischen Satz</div><p>Tippe auf ein Wort im Satz, um es zurückzulegen.</p><div id="ans" class="answer"></div><div id="wordBank" class="sentence"></div><div class="puzzle-actions" id="puzzleActions"></div>';document.getElementById('puzzleActions').appendChild(button('Prüfen','primary',()=>checkPuzzle()));document.getElementById('puzzleActions').appendChild(button('Neu beginnen','',resetPuzzle));renderPuzzle()}
function renderPuzzle(){const bank=document.getElementById('wordBank'),ans=document.getElementById('ans');bank.replaceChildren();ans.replaceChildren();puzzleWords.forEach((w,i)=>{if(!answer.includes(i))bank.appendChild(button(w,'chip',()=>addWord(i)))});answer.forEach((i,pos)=>ans.appendChild(button(puzzleWords[i],'chip',()=>removeWord(pos))))}
function addWord(i){if(advancing||answer.includes(i))return;answer.push(i);fb('',true);renderPuzzle()}
function removeWord(pos){if(advancing)return;answer.splice(pos,1);fb('',true);renderPuzzle()}
function resetPuzzle(){if(advancing)return;answer=[];fb('',true);renderPuzzle()}
function sentence(words){return words.join(' ').replace(/\s+([.,?!])/g,'$1').replace(/([¿¡])\s+/g,'$1')}
const puzzleAlternatives=[['Yo vivo en Madrid.'],['Mi hermana tiene un perro.'],['Ayer fuimos al cine.','Fuimos al cine ayer.','Fuimos ayer al cine.'],['¿Qué vas a hacer mañana?'],['Cuando era pequeño, jugaba al fútbol.'],['No lo compré porque era demasiado caro.'],['Si tuviera más tiempo, aprendería italiano.'],['Aunque hubiera llovido, habríamos salido.']];
function checkPuzzle(){if(advancing)return;if(answer.length!==puzzleWords.length)return fb('Verwende zuerst alle Wörter und Satzzeichen.',false);const actual=sentence(answer.map(i=>puzzleWords[i]));const alternatives=puzzleAlternatives[puzzles.indexOf(currentPuzzle)];if(alternatives.some(x=>x.toLocaleLowerCase('es')===actual.toLocaleLowerCase('es')))win();else fb('Die Reihenfolge stimmt noch nicht. Tippe Wörter an, um sie zu ändern.',false)}
function detect(){let pair=detective[level-1][round%detective[level-1].length];document.getElementById('content').innerHTML='<div class="big">🔎 Welcher Satz ist korrekt?</div><div class="grid" id="choices"></div>';shuffled(pair).forEach(x=>document.getElementById('choices').appendChild(button(x,'choice',el=>checkDetect(el,x,pair[0]))))}
function checkDetect(el,x,a){if(advancing)return;clearChoices();if(x===a){el.classList.add('correct');win()}else{el.classList.add('wrong');fb('Da steckt ein Fehler drin. Versuch es noch einmal.',false)}}
function guess(){currentGuess=guesses[level-1][round%guesses[level-1].length];document.getElementById('content').innerHTML='<div class="big">❓ ¿Quién / qué soy?</div><p id="hint" style="text-align:center;font-size:20px"></p><label for="guessInput">Deine spanische Antwort:</label><input id="guessInput" placeholder="Escribe la palabra..." autocomplete="off"><p id="guessAction" style="text-align:center"></p>';document.getElementById('hint').textContent=currentGuess.h;document.getElementById('guessInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();checkGuess()}};document.getElementById('guessAction').appendChild(button('Antwort prüfen','primary',checkGuess))}
function normalizeGuess(value){return value.normalize('NFC').trim().toLocaleLowerCase('es').replace(/\s+/g,' ').replace(/^(el|la|los|las|un|una) /,'').replace(/[.!?]+$/,'')}
function checkGuess(){if(advancing)return;const v=normalizeGuess(document.getElementById('guessInput').value);if(!v)return fb('Gib zuerst eine Antwort ein.',false);if([currentGuess.a,...(currentGuess.accept||[])].some(x=>normalizeGuess(x)===v))win();else fb('Noch nicht. Denk an die Hinweise und versuch es erneut.',false)}

const stories=[[{"title": "Una mochila equivocada", "place": "🏫", "actors": ["👧", "👦"], "scenes": ["Lucía tiene doce años y va al colegio en autobús. Su mochila es azul. Hoy lleva un libro, una manzana y un bocadillo.", "En clase abre la mochila. ¡Hay unas botas de fútbol y una camiseta! Esta mochila no es suya.", "Su amigo Diego tiene una mochila azul también. Lucía habla con él después de clase. Diego mira su mochila y encuentra el bocadillo de Lucía.", "Los dos cambian las mochilas y se ríen. Después, Lucía pone una cinta amarilla en la suya."], "q": [["¿Cómo va Lucía al colegio?", ["En autobús", "En bicicleta", "A pie"], 0], ["¿Qué encuentra en la mochila equivocada?", ["Un gato", "Unas botas de fútbol y una camiseta", "Una cinta amarilla"], 1], ["¿Para qué pone una cinta en su mochila?", ["Para reconocerla mejor", "Para regalarla", "Para llevar más libros"], 0]], "summaries": ["Lucía confunde su mochila con la de Diego. Después la recupera y le pone una cinta para reconocerla.", "Lucía pierde su mochila en el autobús y compra una nueva de color amarillo.", "Diego regala sus botas a Lucía porque ella quiere jugar al fútbol."]}, {"title": "El picnic bajo techo", "place": "🏡", "actors": ["👦", "👩"], "scenes": ["Es sábado. Pablo quiere comer en el parque con su madre. Preparan pan, queso, tomates y dos botellas de agua.", "Antes de salir, Pablo mira por la ventana. Llueve mucho. Su madre dice: «Hoy no podemos comer en el parque».", "Pablo tiene una idea: pone una manta en el suelo del salón. Su madre trae la comida y abre la cesta.", "Comen juntos y escuchan música. No están en el parque, pero su picnic es divertido. Después juegan a las cartas."], "q": [["¿Qué tiempo hace?", ["Hace sol", "Nieva", "Llueve mucho"], 2], ["¿Dónde hacen el picnic?", ["En el salón", "En el colegio", "En un restaurante"], 0], ["¿Qué hacen después de comer?", ["Van al parque", "Juegan a las cartas", "Preparan otra cesta"], 1]], "summaries": ["Pablo y su madre hacen un picnic en el salón porque llueve. Después juegan a las cartas.", "Pablo va solo al parque y espera a su madre bajo la lluvia.", "Pablo y su madre comen en un restaurante porque no tienen comida en casa."]}], [{"title": "Una tarde sin batería", "place": "🏙️", "actors": ["👩", "👨"], "scenes": ["El viernes, Sara quedó con su primo Mateo delante del museo a las cuatro. Antes de salir, usó el móvil para buscar una tienda y escuchar música. No miró cuánta batería tenía.", "Cuando llegó al centro, el móvil se apagó. Sara no podía consultar el mapa ni llamar a Mateo. Al principio se puso nerviosa, pero recordó el nombre del museo.", "Entró en una panadería y preguntó cómo llegar. La dependienta le explicó que tenía que seguir recto y girar a la derecha después de la biblioteca. Sara siguió sus indicaciones.", "Llegó diez minutos tarde. Mateo la estaba esperando. Visitaron el museo y después tomaron un chocolate. Sara decidió llevar un mapa pequeño la próxima vez."], "q": [["¿Por qué no puede llamar Sara?", ["Ha perdido el número", "Su móvil no tiene batería", "El museo está cerrado"], 1], ["¿Quién le explica el camino?", ["Mateo", "Una dependienta de una panadería", "Un conductor"], 1], ["¿Cómo termina la tarde?", ["Visitan el museo juntos", "Sara vuelve a casa sin ver a Mateo", "Mateo compra un móvil"], 0]], "summaries": ["Sara se queda sin batería. Pide indicaciones en una panadería y llega algo tarde al museo, donde la espera Mateo.", "Sara pierde el móvil en el museo y Mateo vuelve a casa sin ella.", "Una dependienta carga el móvil de Sara y la lleva en coche al museo."]}, {"title": "La bicicleta prestada", "place": "🌳", "actors": ["👧", "👦"], "scenes": ["El domingo, Inés quería ir al mercado de su barrio. Su bicicleta tenía una rueda pinchada, así que su vecino Bruno le prestó la suya. Le pidió que la devolviera antes de las seis.", "Inés compró naranjas y pan. Después pasó por el parque y vio a una amiga. Hablaron durante un rato y perdieron la noción del tiempo.", "A las cinco y media, Inés miró el reloj. Salió enseguida del parque, pero en el camino encontró una calle cortada. Tuvo que tomar un camino más largo.", "Llegó a las seis menos cinco. Bruno todavía estaba en casa. Inés devolvió la bicicleta, le dio dos naranjas para agradecerle el favor y decidió reparar su propia rueda el lunes."], "q": [["¿Por qué pide una bicicleta?", ["La suya tiene una rueda pinchada", "Quiere vender la suya", "No sabe caminar"], 0], ["¿Qué retrasa su regreso después del parque?", ["Una calle cortada", "Un examen", "Una tormenta"], 0], ["¿Devuelve la bicicleta a tiempo?", ["No, llega al día siguiente", "Sí, llega cinco minutos antes de las seis", "No, llega a las siete"], 1]], "summaries": ["Inés usa la bicicleta de Bruno para ir al mercado. Aunque se entretiene y encuentra un desvío, la devuelve a tiempo.", "Inés rompe la bicicleta de Bruno y compra otra en el mercado.", "Bruno acompaña a Inés al parque y ambos llegan tarde a casa."]}], [{"title": "El huerto de la azotea", "place": "🌱", "actors": ["👩", "👨"], "scenes": ["En el edificio de Julia había una azotea que casi nadie utilizaba. Ella propuso convertir una parte en un pequeño huerto. Algunos vecinos apoyaron la idea, pero otros temían que el proyecto resultara caro o provocara problemas con el agua.", "Antes de comprar nada, Julia organizó una reunión. Un vecino que trabajaba como técnico explicó que primero debían comprobar cuánto peso podía soportar la azotea. También acordaron pedir permiso y empezar con pocas macetas.", "Cuando recibieron la autorización y terminaron la revisión, plantaron lechugas y hierbas aromáticas. Hicieron una lista para repartirse el riego. Durante las vacaciones, sin embargo, dos personas olvidaron avisar de que no estarían en casa.", "Varias plantas se secaron. En lugar de abandonar el huerto, los vecinos cambiaron la organización: cada turno tendría una persona responsable y otra de apoyo. Julia aprendió que una buena idea necesita acuerdos claros para funcionar."], "q": [["¿Qué hacen antes de plantar?", ["Compran un terreno", "Revisan la azotea y piden permiso", "Invitan a un cocinero"], 1], ["¿Por qué se secan algunas plantas?", ["Nadie sabe qué han plantado", "Falla la organización del riego durante las vacaciones", "Llueve demasiado"], 1], ["¿Qué aprendizaje expresa el final?", ["La organización también es necesaria", "Los huertos siempre fracasan", "Es mejor no hablar con los vecinos"], 0]], "summaries": ["Los vecinos crean un huerto tras revisar la azotea y obtener permiso. Un problema con el riego les lleva a mejorar los turnos.", "Julia planta sin consultar a nadie y el edificio tiene que cerrar la azotea por exceso de peso.", "Los vecinos abandonan el huerto porque todas las plantas se secan y el agua cuesta demasiado."]}, {"title": "El mensaje que faltaba", "place": "🎭", "actors": ["👧", "👦"], "scenes": ["Nora y Álex preparaban una obra para la fiesta del instituto. El grupo había ensayado durante tres semanas. El miércoles, la profesora cambió el ensayo del jueves al viernes porque el salón de actos no estaba disponible.", "Álex publicó el cambio en el chat del grupo. Nora no vio el mensaje: había silenciado las notificaciones mientras estudiaba. El jueves llegó al instituto con su vestuario y encontró la puerta del salón cerrada.", "Al principio pensó que sus compañeros la habían excluido. Escribió un mensaje enfadado, pero antes de enviarlo llamó a Álex. Él le explicó lo ocurrido y le pidió disculpas por no haber comprobado que todos conocían el cambio.", "El viernes, Nora participó en el ensayo. El grupo acordó que los cambios importantes se anunciarían en el chat y también en clase. Nora se alegró de haber preguntado antes de sacar conclusiones."], "q": [["¿Por qué cambia la fecha del ensayo?", ["Nora no quiere participar", "El salón no está disponible", "Álex ha perdido su vestuario"], 1], ["¿Qué evita un conflicto mayor?", ["Nora llama antes de enviar su mensaje", "Álex cancela la obra", "La profesora cierra el chat"], 0], ["¿Qué acuerda el grupo?", ["No volver a ensayar", "Anunciar los cambios también en clase", "Usar únicamente mensajes privados"], 1]], "summaries": ["Nora no ve un cambio de fecha y cree que la han excluido. Una llamada aclara el malentendido y el grupo mejora su comunicación.", "Los compañeros excluyen a Nora de la obra y ella decide abandonar el instituto.", "Nora cambia el ensayo al jueves y Álex protesta porque no ha recibido una llamada."]}], [{"title": "Una noticia demasiado perfecta", "place": "📰", "actors": ["👩", "👨"], "scenes": ["El periódico del instituto recibió un mensaje que prometía transporte gratuito para todos los jóvenes de la ciudad a partir del mes siguiente. La noticia parecía perfecta para la portada. Sin embargo, el mensaje no incluía un enlace al anuncio original y la fotografía mostraba un autobús de otra ciudad.", "Mientras algunos redactores querían publicarla enseguida, Elena propuso verificarla. Encontró una propuesta de una asociación, pero ninguna decisión aprobada. Además, el documento hablaba de descuentos para estudiantes, no de viajes gratuitos para todos los jóvenes.", "El equipo llamó al servicio municipal de información. Allí confirmaron que se estaba estudiando una medida, aunque todavía no se habían fijado ni las condiciones ni la fecha. Elena sugirió un título menos espectacular que distinguiera claramente la propuesta de una decisión.", "Publicaron un artículo sobre el debate, indicando qué estaba confirmado y qué seguía pendiente. Recibieron menos visitas de las que esperaban, pero varios lectores agradecieron la claridad. El equipo comprendió que informar con rigor a veces exige renunciar a un titular llamativo."], "q": [["¿Qué diferencia descubre Elena?", ["Existe una propuesta, pero no una decisión aprobada", "El transporte ya es gratuito", "La asociación ha cerrado"], 0], ["¿Qué confirma el servicio municipal?", ["La fecha exacta de la gratuidad", "Que una medida sigue en estudio", "Que todos los autobuses serán nuevos"], 1], ["¿Qué prioridad adopta el periódico?", ["Obtener visitas a cualquier precio", "Ocultar la falta de información", "Distinguir los hechos confirmados de lo pendiente"], 2]], "summaries": ["El equipo verifica una noticia y descubre que exagera una propuesta aún no aprobada. Publica un artículo prudente que separa lo confirmado de lo pendiente.", "Elena confirma que todos los jóvenes viajarán gratis el mes siguiente y el periódico anuncia la fecha.", "El periódico decide no informar sobre transporte porque los lectores rechazan los artículos claros."]}, {"title": "La biblioteca que cambia", "place": "📚", "actors": ["👩", "👨"], "scenes": ["La biblioteca del barrio quería atraer a más adolescentes. Su directora propuso convertir una sala poco utilizada en un espacio para proyectos, conversaciones y talleres. Parte del vecindario acogió la idea con entusiasmo; otras personas temían perder uno de los pocos lugares tranquilos de la zona.", "En la primera reunión, las opiniones parecían incompatibles. Marcos, un estudiante que preparaba sus exámenes allí, defendía el silencio. Amina, que coordinaba un club de lectura, recordaba que una biblioteca también podía ser un lugar de encuentro. Ambos coincidían, sin embargo, en que el espacio debía seguir siendo accesible para todos.", "La directora propuso una prueba de seis semanas. Los talleres se celebrarían en horarios concretos y la sala de estudio mantendría su función habitual. Se instalarían señales claras y se recogerían comentarios de los usuarios para valorar el ruido y la asistencia.", "Al terminar la prueba, hubo quejas sobre un taller especialmente ruidoso, pero también participaron jóvenes que nunca habían entrado en la biblioteca. Ajustaron los horarios y trasladaron esa actividad a otro local. La solución no eliminó todas las diferencias, aunque permitió combinar usos sin renunciar al estudio."], "q": [["¿En qué coinciden Marcos y Amina?", ["En cerrar la sala de estudio", "En mantener un espacio accesible para todos", "En prohibir todos los talleres"], 1], ["¿Para qué sirve la prueba de seis semanas?", ["Para evaluar los nuevos usos y sus efectos", "Para vender la biblioteca", "Para sustituir todos los libros"], 0], ["¿Cómo se aborda el taller ruidoso?", ["Se ignoran las quejas", "Se eliminan todos los proyectos", "Se cambia de local y se ajustan los horarios"], 2]], "summaries": ["La biblioteca prueba nuevos usos sin cerrar la sala de estudio. Tras recoger opiniones, ajusta horarios y traslada una actividad ruidosa.", "La biblioteca sustituye la sala de estudio por talleres y decide que los exámenes ya no son importantes.", "Todos los vecinos rechazan la prueba y la directora cancela las actividades antes de empezarlas."]}]];

let activeStory=null, activeMode='', questionIndex=0, sceneIndex=0, questionLocked=false, speechRun=0;
function stopMedia(){document.querySelectorAll("iframe.film-frame").forEach(f=>f.contentWindow?.postMessage("pause-film","*"));speechRun++;if(window.speechSynthesis)window.speechSynthesis.cancel();document.querySelectorAll('.actor').forEach(x=>x.classList.remove('speaking'))}
function mediaStatus(text){const el=document.getElementById('mediaStatus');if(el)el.textContent=text}
function speak(text){stopMedia();if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){mediaStatus('Die Sprachausgabe ist hier nicht verfügbar. Du kannst den Text einblenden und lesen.');return}const run=speechRun;const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=level===1?.8:level===2?.9:1;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase().startsWith('es'));if(voice)u.voice=voice;u.onstart=()=>{if(run!==speechRun)return;mediaStatus('Die Geschichte wird vorgelesen.');document.querySelectorAll('.actor').forEach(x=>x.classList.add('speaking'))};u.onend=()=>{if(run!==speechRun)return;mediaStatus('Fertig. Du kannst noch einmal hören.');document.querySelectorAll('.actor').forEach(x=>x.classList.remove('speaking'))};u.onerror=()=>{if(run!==speechRun)return;mediaStatus('Die Stimme konnte nicht abgespielt werden. Bitte nutze den eingeblendeten Text.');document.querySelectorAll('.actor').forEach(x=>x.classList.remove('speaking'))};mediaStatus('Sprachausgabe wird gestartet …');try{window.speechSynthesis.speak(u)}catch(e){u.onerror()}}
function addControl(parent,label,action,cls=''){parent.appendChild(button(label,cls,action))}
function storyText(parent){const box=document.createElement('div');box.className='story-text';box.lang='es';activeStory.scenes.forEach(t=>{const paragraph=document.createElement('p');paragraph.textContent=t;box.appendChild(paragraph)});parent.appendChild(box);return box}
function storyActivity(mode){activeStory=stories[level-1][round%stories[level-1].length];activeMode=mode;questionIndex=0;questionLocked=false;sceneIndex=0;const root=document.getElementById('content');root.replaceChildren();const title=document.createElement('h3');title.className='story-heading';title.textContent=activeStory.title;title.lang='es';root.appendChild(title);
if(mode==='reading'||mode==='summary'){storyText(root)}
if(mode==='listening'){const tip=document.createElement('p');tip.className='reading-tip';tip.textContent='Höre zuerst die Geschichte. Die Stimme kommt von deinem Gerät; Qualität und Verfügbarkeit können variieren. Du kannst beliebig oft hören oder den Text als Hilfe einblenden.';root.appendChild(tip);const controls=document.createElement('div');controls.className='activity-controls';root.appendChild(controls);addControl(controls,'▶ Geschichte anhören',()=>speak(activeStory.scenes.join(' ')),'primary');addControl(controls,'■ Stoppen',()=>{stopMedia();mediaStatus('Wiedergabe gestoppt.')});const transcript=document.createElement('div');transcript.id='transcript';transcript.hidden=true;storyText(transcript);addControl(controls,'Text einblenden',b=>{transcript.hidden=!transcript.hidden;b.textContent=transcript.hidden?'Text einblenden':'Text ausblenden'});root.appendChild(transcript);const status=document.createElement('p');status.id='mediaStatus';status.className='media-status';status.setAttribute('role','status');root.appendChild(status)}
if(mode==='cinema'){const tip=document.createElement('p');tip.className='reading-tip';tip.textContent='Ein gezeichneter Trickfilm mit spanischen Dialogen. Die Stimme hängt von deinem Gerät ab; Untertitel sind immer sichtbar. Danach kannst du die Fragen öffnen.';root.appendChild(tip);const frame=document.createElement('iframe');frame.className='film-frame';frame.title=activeStory.title+' – Trickfilm';frame.srcdoc=filmDocument(level,round%2);root.appendChild(frame);const controls=document.createElement('div');controls.className='activity-controls';root.appendChild(controls);addControl(controls,'Fragen zum Film öffnen',()=>{stopMedia();const questions=document.getElementById('storyQuestions');questions.hidden=false;if(!questions.children.length)renderQuestion();questions.scrollIntoView?.({behavior:'smooth',block:'start'})},'primary')}
const questions=document.createElement('div');questions.id='storyQuestions';root.appendChild(questions);if(mode==='cinema'){questions.hidden=true}else if(mode==='summary')renderSummary();else renderQuestion()}
function renderScene(){stopMedia();const parent=document.getElementById('scene');parent.replaceChildren();const count=document.createElement('p');count.className='question-number';count.textContent='Szene '+(sceneIndex+1)+' von '+activeStory.scenes.length;parent.appendChild(count);const stage=document.createElement('div');stage.className='cinema-stage';stage.setAttribute('aria-hidden','true');const place=document.createElement('div');place.className='scene-place';place.textContent=activeStory.place;stage.appendChild(place);activeStory.actors.forEach(a=>{const actor=document.createElement('div');actor.className='actor';actor.textContent=a;stage.appendChild(actor)});parent.appendChild(stage);const caption=document.createElement('p');caption.className='scene-caption';caption.lang='es';caption.textContent=activeStory.scenes[sceneIndex];parent.appendChild(caption);const controls=document.createElement('div');controls.className='activity-controls';parent.appendChild(controls);addControl(controls,'◀ Zurück',()=>{sceneIndex--;renderScene()});controls.lastChild.disabled=sceneIndex===0;addControl(controls,'▶ Szene anhören',()=>speak(activeStory.scenes[sceneIndex]));addControl(controls,'■ Stoppen',()=>{stopMedia();mediaStatus('Wiedergabe gestoppt.')});if(sceneIndex<activeStory.scenes.length-1)addControl(controls,'Nächste Szene →',()=>{sceneIndex++;renderScene()},'primary');else addControl(controls,'Zu den Fragen →',()=>{stopMedia();document.getElementById('storyQuestions').hidden=false;renderQuestion();document.getElementById('storyQuestions').scrollIntoView?.({behavior:'smooth',block:'start'})},'primary');const status=document.createElement('p');status.className='media-status';status.id='mediaStatus';status.setAttribute('role','status');parent.appendChild(status)}
function renderQuestion(){questionLocked=false;const root=document.getElementById('storyQuestions');root.replaceChildren();const count=document.createElement('p');count.className='question-number';count.textContent='Frage '+(questionIndex+1)+' von '+activeStory.q.length;root.appendChild(count);const q=activeStory.q[questionIndex];const title=document.createElement('h3');title.lang='es';title.textContent=q[0];root.appendChild(title);const options=document.createElement('div');options.className='story-options';root.appendChild(options);shuffled(q[1].map((text,index)=>({text,index}))).forEach(x=>{const b=button(x.text,'choice',el=>answerQuestion(el,x.index));b.lang='es';options.appendChild(b)})}
function answerQuestion(el,index){if(advancing||questionLocked)return;clearChoices();if(index!==activeStory.q[questionIndex][2]){el.classList.add('wrong');fb('Noch nicht. Prüfe die Geschichte und versuch es erneut.',false);return}el.classList.add('correct');questionLocked=true;if(questionIndex===activeStory.q.length-1){win();return}fb('¡Correcto! Weiter zur nächsten Frage.',true);addControl(document.getElementById('storyQuestions'),'Nächste Frage →',()=>{if(advancing)return;questionIndex++;fb('',true);renderQuestion()},'primary')}
function renderSummary(){const root=document.getElementById('storyQuestions');const h=document.createElement('h3');h.textContent='¿Qué resumen es correcto?';h.lang='es';root.appendChild(h);const options=document.createElement('div');options.className='story-options';root.appendChild(options);shuffled(activeStory.summaries.map((text,index)=>({text,index}))).forEach(x=>{const b=button(x.text,'choice',el=>{if(advancing)return;clearChoices();if(x.index===0){el.classList.add('correct');win()}else{el.classList.add('wrong');fb('Diese Zusammenfassung verändert wichtige Details. Lies noch einmal.',false)}});b.lang='es';options.appendChild(b)})}
function mission(){const task=missions[level-1][round%missions[level-1].length];document.getElementById('content').innerHTML='<h3 id="missionTitle" class="story-heading"></h3><p id="missionPrompt" class="scene-caption" lang="es"></p><div id="missionChoices" class="story-options"></div>';document.getElementById('missionTitle').textContent='💬 '+task[0];document.getElementById('missionPrompt').textContent=task[1];shuffled(task[2].map((text,index)=>({text,index}))).forEach(x=>{const b=button(x.text,'choice',el=>{if(advancing)return;clearChoices();if(x.index===task[3]){el.classList.add('correct');win();fb('¡Muy bien! '+task[4]+' +10 ⭐',true)}else{el.classList.add('wrong');fb('Passt das zur Situation? Versuch es noch einmal.',false)}});b.lang='es';document.getElementById('missionChoices').appendChild(b)})}

bubble": "Mejor juntos"}]}, {"title": "El mensaje que faltaba", "level": 3, "theme": "theatre", "icon": "🎭", "places": ["El cambio de fecha", "La puerta cerrada", "Una llamada", "Un acuerdo"], "props": [["📱", "📅"], ["🔒", "🎭"], ["📞", "💬"], ["🎭", "✅"]], "shots": [{"who": "Narrador", "text": "Nora y Álex preparaban una obra para la fiesta del instituto. El grupo había ensayado durante tres semanas. El miércoles, la profesora cambió el ensayo del jueves al viernes porque el salón de actos no estaba disponible.", "actor": "", "scene": 0}, {"who": "Álex", "text": "El ensayo será el viernes. El jueves no podemos usar el salón.", "actor": "leo", "scene": 0, "bubble": "El viernes"}, {"who": "Narrador", "text": "Álex publicó el cambio en el chat del grupo. Nora no vio el mensaje: había silenciado las notificaciones mientras estudiaba. El jueves llegó al instituto con su vestuario y encontró la puerta del salón cerrada.", "actor": "", "scene": 1}, {"who": "Nora", "text": "La puerta está cerrada. ¿Se han olvidado de mí?", "actor": "ana", "scene": 1, "bubble": "¿Qué pasa?"}, {"who": "Narrador", "text": "Al principio pensó que sus compañeros la habían excluido. Escribió un mensaje enfadado, pero antes de enviarlo llamó a Álex. Él le explicó lo ocurrido y le pidió disculpas por no haber comprobado que todos conocían el cambio.", "actor": "", "scene": 2}, {"who": "Nora", "text": "Voy a llamar a Álex antes de enviar este mensaje.", "actor": "ana", "scene": 2, "bubble": "Primero, hablar"}, {"who": "Narrador", "text": "El viernes, Nora participó en el ensayo. El grupo acordó que los cambios importantes se anunciarían en el chat y también en clase. Nora se alegró de haber preguntado antes de sacar conclusiones.", "actor": "", "scene": 3}, {"who": "Álex", "text": "Anunciaremos los cambios en el chat y también en clase.", "actor": "leo", "scene": 3, "bubble": "Todos informados"}]}, {"title": "Una noticia demasiado perfecta", "level": 4, "theme": "news", "icon": "📰", "places": ["Una noticia llamativa", "Buscar la fuente", "La confirmación", "Publicar con rigor"], "props": [["📰", "🚌"], ["🔎", "📄"], ["☎️", "⏳"], ["📰", "✅"]], "shots": [{"who": "Narrador", "text": "El periódico del instituto recibió un mensaje que prometía transporte gratuito para todos los jóvenes de la ciudad a partir del mes siguiente. La noticia parecía perfecta para la portada. Sin embargo, el mensaje no incluía un enlace al anuncio original y la fotografía mostraba un autobús de otra ciudad.", "actor": "", "scene": 0}, {"who": "Elena", "text": "La fotografía no parece de nuestra ciudad. Tenemos que verificar la noticia.", "actor": "ana", "scene": 0, "bubble": "¿Es verdad?"}, {"who": "Narrador", "text": "Mientras algunos redactores querían publicarla enseguida, Elena propuso verificarla. Encontró una propuesta de una asociación, pero ninguna decisión aprobada. Además, el documento hablaba de descuentos para estudiantes, no de viajes gratuitos para todos los jóvenes.", "actor": "", "scene": 1}, {"who": "Elena", "text": "Solo encuentro una propuesta de descuentos, no una decisión sobre viajes gratuitos.", "actor": "ana", "scene": 1, "bubble": "Una propuesta"}, {"who": "Narrador", "text": "El equipo llamó al servicio municipal de información. Allí confirmaron que se estaba estudiando una medida, aunque todavía no se habían fijado ni las condiciones ni la fecha. Elena sugirió un título menos espectacular que distinguiera claramente la propuesta de una decisión.", "actor": "", "scene": 2}, {"who": "Redactor", "text": "El servicio municipal confirma que la medida sigue en estudio.", "actor": "leo", "scene": 2, "bubble": "Sin fecha aún"}, {"who": "Narrador", "text": "Publicaron un artículo sobre el debate, indicando qué estaba confirmado y qué seguía pendiente. Recibieron menos visitas de las que esperaban, pero varios lectores agradecieron la claridad. El equipo comprendió que informar con rigor a veces exige renunciar a un titular llamativo.", "actor": "", "scene": 3}, {"who": "Elena", "text": "Nuestro artículo distinguirá los hechos confirmados de lo que sigue pendiente.", "actor": "ana", "scene": 3, "bubble": "Informar bien"}]}, {"title": "La biblioteca que cambia", "level": 4, "theme": "library", "icon": "📚", "places": ["Una biblioteca abierta", "Opiniones diferentes", "Seis semanas de prueba", "Ajustar la solución"], "props": [["📚", "💡"], ["📖", "💬"], ["📅", "📝"], ["📚", "🤝"]], "shots": [{"who": "Narrador", "text": "La biblioteca del barrio quería atraer a más adolescentes. Su directora propuso convertir una sala poco utilizada en un espacio para proyectos, conversaciones y talleres. Parte del vecindario acogió la idea con entusiasmo; otras personas temían perder uno de los pocos lugares tranquilos de la zona.", "actor": "", "scene": 0}, {"who": "Directora", "text": "Queremos abrir la biblioteca a nuevos proyectos sin perder el espacio de estudio.", "actor": "ana", "scene": 0, "bubble": "Nuevos usos"}, {"who": "Narrador", "text": "En la primera reunión, las opiniones parecían incompatibles. Marcos, un estudiante que preparaba sus exámenes allí, defendía el silencio. Amina, que coordinaba un club de lectura, recordaba que una biblioteca también podía ser un lugar de encuentro. Ambos coincidían, sin embargo, en que el espacio debía seguir siendo accesible para todos.", "actor": "", "scene": 1}, {"who": "Marcos", "text": "Necesito silencio para estudiar, pero el espacio debe ser accesible para todos.", "actor": "leo", "scene": 1, "bubble": "Para todos"}, {"who": "Narrador", "text": "La directora propuso una prueba de seis semanas. Los talleres se celebrarían en horarios concretos y la sala de estudio mantendría su función habitual. Se instalarían señales claras y se recogerían comentarios de los usuarios para valorar el ruido y la asistencia.", "actor": "", "scene": 2}, {"who": "Amina", "text": "Probemos durante seis semanas y escuchemos a los usuarios.", "actor": "ana", "scene": 2, "bubble": "Una prueba"}, {"who": "Narrador", "text": "Al terminar la prueba, hubo quejas sobre un taller especialmente ruidoso, pero también participaron jóvenes que nunca habían entrado en la biblioteca. Ajustaron los horarios y trasladaron esa actividad a otro local. La solución no eliminó todas las diferencias, aunque permitió combinar usos sin renunciar al estudio.", "actor": "", "scene": 3}, {"who": "Directora", "text": "Ajustaremos los horarios y trasladaremos el taller ruidoso a otro local.", "actor": "ana", "scene": 3, "bubble": "Un acuerdo"}]}];
